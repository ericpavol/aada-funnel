# Render service definition. One instance, one attached disk -- deliberately;
# SQLite (app/db.py) wants exactly one process writing to one file, and Render's
# hobby tier defaults to this shape already, so there is nothing to turn off.
#
# AADA_USER / AADA_PASS are NOT set here -- `sync: false` means Render prompts
# for them once in the dashboard and stores them as encrypted secrets. They must
# never be committed to this file or anywhere else in the repo.
services:
  - type: web
    name: aada-funnel
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # On: a push to `main` deploys. This was briefly turned off in favour of
    # triggering each deploy by hand, which failed in practice -- the Blueprint
    # Sync Hook only re-applies THIS file's config and does not deploy code, and
    # the per-service Deploy Hook that would have worked needs pulling from the
    # dashboard by hand, which defeats the point of not touching the dashboard.
    #
    # The safety gate was never really this flag: it is that work happens on
    # `dev` and only reaches `main` via an explicit, asked-for merge. What
    # actually went wrong once was staying on `main` AFTER a merge and
    # committing there. The guard for that is switching back to `dev`
    # immediately after every merge -- see PROJECT.md.
    autoDeploy: true
    disk:
      name: aada-funnel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: AADA_DB
        value: /var/data/funnel.db
      - key: AADA_USER
        sync: false
      - key: AADA_PASS
        sync: false
